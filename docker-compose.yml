# Produção (Dokploy): https://apijoaodomingues.guilhermeviana.com
#   O domínio aponta para o serviço "api", porta 8048, no separador Domains.
#   As variáveis vêm do separador Environment (vira o .env ao lado deste ficheiro).
#   A base é o MySQL criado no Dokploy, ligado por DATABASE_URL
#   (mysql://utilizador:senha@host-interno:3306/base).
#   Nada é publicado em portas do host: o Traefik do Dokploy chega à API pela rede.
# Local (com MySQL próprio):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Migrations, chaves do Passport e seeders correm no arranque (start.sh).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: joao-domingues-api
    expose:
      - "8048"
    env_file:
      - .env
    environment:
      APP_URL: "${APP_URL:-https://apijoaodomingues.guilhermeviana.com}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      PHP_CLI_SERVER_WORKERS: "${PHP_CLI_SERVER_WORKERS:-4}"
      DB_CONNECTION: mysql
    volumes:
      # Fotos dos imóveis e chaves do Passport sobrevivem aos redeploys.
      - joao-storage-public:/var/www/html/storage/app/public
      - joao-passport:/var/www/html/storage/oauth
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8048/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  joao-storage-public:
  joao-passport:
